<section id="inicio" class="hero text-center text-white">
  <video autoplay loop muted [muted]="true" playsinline class="hero-video">
    <source src="/videos/video1.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay"></div>

  <div class="container position-relative z-1">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <span class="badge rounded-pill mb-3 px-3 py-2" style="background-color: var(--secondary); font-size: 0.9rem;">Agencia de Marketing Digital</span>
        <h1 class="display-3 fw-bold mb-4">Impulsa tu negocio al <br><span style="color: var(--secondary);">siguiente nivel</span></h1>
        <p class="lead mb-5">Ayudamos a marcas ambiciosas a crecer, conseguir más clientes y destacar en redes sociales mediante contenido visual de alto impacto y resultados medibles.</p>
        
        <div class="d-flex justify-content-center gap-3">
          <a routerLink="/servicios" class="btn-primary btn-large shadow-btn rounded-pill text-decoration-none">Descubre Nuestros Servicios</a>
          <a href="#contacto" class="btn-outline-light-custom btn-large rounded-pill fw-bold">Hablemos</a>
        </div>
      </div>
    </div>
  </div>
</section>
